services:
  postgres:
    image: postgres:15
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/20-init-app-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal"]
      interval: 5s
      timeout: 5s
      retries: 10

  temporal:
    image: temporalio/auto-setup:1.24.2
    ports:
      - "127.0.0.1:7233:7233"
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=temporal
      - POSTGRES_SEEDS=postgres
      - DYNAMIC_CONFIG_FILE_PATH=config/dynamicconfig/development-sql.yaml
    volumes:
      - ./temporal-dynamicconfig.yaml:/etc/temporal/config/dynamicconfig/development-sql.yaml:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "tctl", "--address", "temporal:7233", "namespace", "list"]
      interval: 5s
      timeout: 10s
      retries: 24
      start_period: 20s

  temporal-ui:
    image: temporalio/ui:2.27.0
    ports:
      - "127.0.0.1:8233:8080"
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://localhost:8000,http://localhost:8233
    depends_on:
      temporal:
        condition: service_healthy

  hermes-gateway:
    build:
      context: ../..
      dockerfile: services/hermes/Dockerfile
    ports:
      - "127.0.0.1:8642:8642"
    env_file:
      - .env
    environment:
      - OPENCODE_GO_API_KEY=${LLM_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - TAVILY_API_KEY=${TAVILY_API_KEY:-}
      - API_SERVER_ENABLED=true
      - API_SERVER_HOST=0.0.0.0
      - API_SERVER_PORT=8642
      - API_SERVER_KEY=${HERMES_API_KEY:-}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8642/health"]
      interval: 10s
      timeout: 5s
      retries: 24
      start_period: 60s

  auth:
    build:
      context: ../..
      dockerfile: services/auth/Dockerfile
    env_file:
      - .env
    ports:
      - "127.0.0.1:3100:3100"
    environment:
      - DATABASE_URL=postgresql://app_user:app_password@postgres:5432/app_db
      - AUTH_SECRET=${AUTH_SECRET:-dev-secret-change-in-production}
      - BETTER_AUTH_URL=${BETTER_AUTH_URL:-http://localhost:8000}
      - CORS_ORIGINS=${CORS_ORIGINS:-}
      - PORT=3100
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID:-}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET:-}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3100/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  api:
    build:
      context: ../..
      dockerfile: services/api/Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - DATABASE_URL=postgresql://app_user:app_password@postgres:5432/app_db
      - HERMES_API_URL=http://hermes-gateway:8642
      - AUTH_SERVICE_URL=http://auth:3100
      - TEMPORAL_UI_URL=${TEMPORAL_UI_URL:-http://localhost:8233}
      - UPLOAD_DIR=/app/uploads
    volumes:
      - upload_data:/app/uploads
    depends_on:
      temporal:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  worker:
    build:
      context: ../..
      dockerfile: services/workers/Dockerfile
    env_file:
      - .env
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - DATABASE_URL=postgresql://app_user:app_password@postgres:5432/app_db
      - HERMES_API_URL=http://hermes-gateway:8642
      - HERMES_API_KEY=${HERMES_API_KEY:-}
      - API_PUBLIC_URL=${API_PUBLIC_URL:-http://api:8000}
      - TASK_QUEUE=grading
    volumes:
      - upload_data:/app/uploads
    depends_on:
      temporal:
        condition: service_healthy
      postgres:
        condition: service_healthy
      hermes-gateway:
        condition: service_healthy

  mongodb:
    image: mongo:8.0
    volumes:
      - mongodb_data:/data/db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  librechat:
    image: ghcr.io/danny-avila/librechat:v0.8.4
    ports:
      - "127.0.0.1:3080:3080"
    env_file:
      - ../../services/librechat/.env
    environment:
      - MONGO_URI=mongodb://mongodb:27017/LibreChat
      - HERMES_API_KEY=${HERMES_API_KEY:-}
      - CREDS_KEY=${LIBRECHAT_CREDS_KEY:-f34be427ebb29de8d88c107a71546019685ed8b241d8f2ed00c3df97ad2566f0}
      - CREDS_IV=${LIBRECHAT_CREDS_IV:-e2341419ec3dd3d19b13a1a87fafcbfb}
      - JWT_SECRET=${LIBRECHAT_JWT_SECRET:-16f8c0ef4a5d391b26034086c628469d3f9f497f08163ab9b40137092f2909ef}
      - JWT_REFRESH_SECRET=${LIBRECHAT_JWT_REFRESH_SECRET:-eaa5191f2914e30b9387fd84e254e4ba6571c33bc6e1a2c6bbba681d532aef51}
    volumes:
      - ../../services/librechat/librechat.yaml:/app/librechat.yaml:ro
    depends_on:
      mongodb:
        condition: service_healthy
      hermes-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3080/api/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped

volumes:
  postgres_data:
  upload_data:
  mongodb_data:
